spring:
  application:
    name: movie-ticket-agent-server
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080

alipay:
  enabled: ${ALIPAY_ENABLED:false}
  app-id: ${ALIPAY_APP_ID:}
  merchant-private-key: ${ALIPAY_MERCHANT_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  notify-url: ${ALIPAY_NOTIFY_URL:}
  return-url: ${ALIPAY_RETURN_URL:}
  frontend-return-url: ${ALIPAY_FRONTEND_RETURN_URL:http://localhost:8001/orders/{orderId}/pay/result}
  frontend-pay-url: ${ALIPAY_FRONTEND_PAY_URL:http://localhost:8001/orders/{orderId}/pay?alipayCancelled=1}

cos:
  client:
    accessKey: xxx
    secretKey: xxx
    region: xxx
    bucket: xxx
  # todo 需替换配置，然后取消注释
  # Elasticsearch 配置
  # todo 需替换配置，然后取消注释
  #  elasticsearch:
  #    uris: http://localhost:9200
  #    username: root
  #    password: 123456

knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
