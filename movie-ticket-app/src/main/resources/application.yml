spring:
  application:
    name: movie-ticket-agent
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  security:
    jwt:
      issuer: movie-ticket-agent
      secret: ${JWT_SECRET}
      access-ttl: 30m
      refresh-ttl: 7d
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:false}
    password: ${DEMO_USER_PASSWORD:Demo1234}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
